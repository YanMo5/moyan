<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在进入 - YanMo Labs</title>
    <link rel="icon" href="/assets/images/site-avatar.png" type="image/png">
    <link rel="shortcut icon" href="/assets/images/site-avatar.png">
    <meta name="theme-color" content="#070b14">
    <script src="/src/js/theme-boot.js"></script>
    <style>
        :root {
            --splash-bg: #070b14;
            --splash-panel: rgba(12, 19, 33, 0.9);
            --splash-text: #e9eefb;
            --splash-dim: rgba(233, 238, 251, 0.56);
            --splash-accent: #7aa7ff;
            --splash-accent-2: #b48cff;
            --splash-accent-3: #4be3b0;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body.splash {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            color: var(--splash-text);
            background-color: var(--splash-bg);
            background-image:
                radial-gradient(900px 560px at 8% -10%, rgba(122, 167, 255, 0.24), transparent 62%),
                radial-gradient(760px 520px at 98% 4%, rgba(180, 140, 255, 0.18), transparent 60%),
                radial-gradient(720px 520px at 50% 112%, rgba(75, 227, 176, 0.10), transparent 64%);
            background-repeat: no-repeat;
            font-family: 'Inter', 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
            overflow: hidden;
        }

        body.splash::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(148, 178, 255, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 178, 255, 0.045) 1px, transparent 1px);
            background-size: 64px 64px;
            -webkit-mask-image: radial-gradient(900px 640px at 50% 0%, #000 0%, transparent 78%);
            mask-image: radial-gradient(900px 640px at 50% 0%, #000 0%, transparent 78%);
        }

        .loader-wrap {
            position: relative;
            width: min(92vw, 480px);
            min-height: min(76vh, 440px);
            padding: 2.6rem 2rem 1.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 30px;
            background:
                radial-gradient(360px 220px at 50% 0%, rgba(122, 167, 255, 0.12), transparent 70%),
                var(--splash-panel);
            box-shadow:
                0 50px 100px -50px rgba(0, 0, 0, 0.95),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            overflow: hidden;
            isolation: isolate;
        }

        .loader-wrap::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
            background-size: 32px 32px;
            -webkit-mask-image: linear-gradient(180deg, #000, transparent 82%);
            mask-image: linear-gradient(180deg, #000, transparent 82%);
            pointer-events: none;
        }

        body.splash .loader-avatar {
            position: relative;
            z-index: 1;
            width: 112px;
            height: 112px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 1.3rem;
            padding: 6px;
            background: conic-gradient(from 210deg, #7aa7ff, #b48cff 45%, #4be3b0 78%, #7aa7ff);
            box-shadow: 0 24px 50px -22px rgba(122, 167, 255, 0.7);
        }

        body.splash .loader-avatar::after {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background: #0a1120;
        }

        body.splash .loader-avatar img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            object-fit: cover;
            background: #0a1120;
        }

        .kicker {
            position: relative;
            z-index: 1;
            margin-bottom: 0.5rem;
            color: var(--splash-accent);
            font-family: 'Roboto Mono', 'JetBrains Mono', Consolas, monospace;
            font-size: 0.58rem;
            letter-spacing: 0.22em;
        }

        .title {
            position: relative;
            z-index: 1;
            margin: 0;
            font-size: clamp(2rem, 6vw, 2.8rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.06em;
            background: linear-gradient(112deg, #f2f6ff 4%, #b8ceff 40%, #d3c1ff 68%, #8ff1d0 96%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sub {
            position: relative;
            z-index: 1;
            margin: 0.65rem 0 2rem;
            color: var(--splash-dim);
            font-family: 'Roboto Mono', 'JetBrains Mono', Consolas, monospace;
            font-size: 0.66rem;
            letter-spacing: 0.12em;
        }

        .bar {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 320px;
            height: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.045);
            overflow: hidden;
        }

        .bar > span {
            display: block;
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--splash-accent), var(--splash-accent-2) 55%, var(--splash-accent-3));
            box-shadow: 0 0 18px rgba(122, 167, 255, 0.6);
            transition: width 0.18s linear;
        }

        .meta {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 320px;
            margin-top: 0.7rem;
            display: flex;
            justify-content: space-between;
            color: var(--splash-dim);
            font-family: 'Roboto Mono', 'JetBrains Mono', Consolas, monospace;
            font-size: 0.58rem;
            letter-spacing: 0.12em;
        }

        .meta strong { color: var(--splash-accent-3); font-weight: 600; }

        .footnote {
            position: relative;
            z-index: 1;
            margin-top: 2rem;
            color: rgba(233, 238, 251, 0.3);
            font-family: 'Roboto Mono', 'JetBrains Mono', Consolas, monospace;
            font-size: 0.54rem;
            letter-spacing: 0.18em;
        }

        @media (max-width: 520px) {
            .loader-wrap { padding: 2rem 1.2rem 1.2rem; border-radius: 24px; }
            body.splash .loader-avatar { width: 96px; height: 96px; }
        }

    </style>
    <link id="skin-stylesheet" rel="stylesheet" href="/src/css/theme-lumina.css">
    <meta name="description" content="正在进入 YanMo Labs。">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="YanMo Labs">
    <meta property="og:title" content="加载中 - YanMo Labs">
    <meta property="og:description" content="正在进入 YanMo Labs。">
    <meta property="og:image" content="/assets/images/og-cover.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="YanMo Labs — Security Research">
    <meta property="og:locale" content="zh_CN">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="加载中 - YanMo Labs">
    <meta name="twitter:description" content="正在进入 YanMo Labs。">
    <meta name="twitter:image" content="/assets/images/og-cover.png">
    <meta name="twitter:image:alt" content="YanMo Labs — Security Research">
    <meta name="author" content="YanMo">
    <meta name="robots" content="noindex, nofollow">
</head>
<body class="splash">
    <main class="loader-wrap" aria-live="polite">
        <div class="kicker">SYSTEM.BOOT // VERIFYING</div>
        <div class="loader-avatar">
            <img src="/assets/images/site-avatar.png" alt="站点头像">
        </div>
        <h1 class="title">YanMo</h1>
        <p class="sub">SECURITY RESEARCH · PERSONAL BLOG</p>
        <div class="bar" aria-hidden="true"><span id="load-progress"></span></div>
        <div class="meta">
            <span>LOADING_ASSETS</span>
            <strong id="load-percent">0%</strong>
        </div>
        <div class="footnote">YANMO LABS // EST. 2023</div>
    </main>

    <script>
        (function () {
            var progressEl = document.getElementById('load-progress');
            var percentEl = document.getElementById('load-percent');
            var progress = 0;
            var timer = window.setInterval(function () {
                progress = Math.min(progress + 8, 100);
                progressEl.style.width = progress + '%';
                percentEl.textContent = progress + '%';

                if (progress >= 100) {
                    window.clearInterval(timer);
                    window.setTimeout(function () {
                        window.location.href = '/src/pages/index.html';
                    }, 180);
                }
            }, 90);
        })();
    </script>
</body>
</html>
