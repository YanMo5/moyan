    <main>
        <section class="guestbook-page">
            <h1>留言板申请 | MESSAGE APPLY</h1>
            <p class="guestbook-description">欢迎留下你的想法和建议</p>
            
            <div class="guestbook-form">
                <h2>写留言</h2>
                <form id="message-form">
                    <div class="form-group">
                        <label for="name">姓名</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">留言内容</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="btn">提交留言</button>
                    <div id="form-message" class="form-message"></div>
                </form>
                <script>
                    document.getElementById('message-form').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        
                        const name = document.getElementById('name').value;
                        const email = document.getElementById('email').value;
                        const message = document.getElementById('message').value;
                        const formMessage = document.getElementById('form-message');
                        
                        formMessage.textContent = '提交中...';
                        formMessage.style.color = '#0ff';
                        
                        try {
                            const response = await fetch('/api/messages', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ name, email, message })
                            });
                            
                            if (response.ok) {
                                formMessage.textContent = '留言提交成功！';
                                formMessage.style.color = '#00ff80';
                                document.getElementById('message-form').reset();
                            } else {
                                const error = await response.json();
                                formMessage.textContent = '提交失败: ' + error.error;
                                formMessage.style.color = '#ff6b6b';
                            }
                        } catch (error) {
                            formMessage.textContent = '网络错误，请稍后再试';
                            formMessage.style.color = '#ff6b6b';
                        }
                    });
                </script>
            </div>
        </section>
    </main>
